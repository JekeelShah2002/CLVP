<section class="notfound-page">
  <app-animated-bg></app-animated-bg>

  <div class="notfound-container">
    <!-- 404 Giant Number -->
    <div class="error-code-wrapper">
      <div class="error-glow"></div>
      <h1 class="error-code">404</h1>
    </div>

    <!-- Icon -->
    <div class="lost-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="28" stroke="url(#grad)" stroke-width="2.5" stroke-dasharray="6 4"/>
        <path d="M22 26c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M34 26c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M20 41c2.5-4 7.5-6 12-6s9.5 2 12 6" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
        <defs>
          <linearGradient id="grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7c3aed"/>
            <stop offset="1" stop-color="#4f46e5"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Text content -->
    <div class="notfound-text">
      <p class="notfound-subtitle">Oops! You've drifted off the grid.</p>
      <h2 class="notfound-title">Page Not Found</h2>
      <p class="notfound-description">
        The page you're looking for doesn't exist, was moved, or is temporarily unavailable.
        Let's get you back on track.
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="notfound-actions">
      <button class="btn-primary" (click)="goHome()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Back to Home
      </button>
      <button class="btn-ghost" (click)="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Go Back
      </button>
    </div>

    <!-- Quick links -->
    <div class="quick-links">
      <span class="quick-label">Quick links:</span>
      <a routerLink="/home" class="quick-link">Dashboard</a>
      <a routerLink="/customers" class="quick-link">Customers</a>
      <a routerLink="/docs" class="quick-link">Docs</a>
      <a routerLink="/about" class="quick-link">About</a>
    </div>
  </div>
</section>
