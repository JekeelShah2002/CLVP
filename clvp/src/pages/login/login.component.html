<div id="bg-wrap"></div>

<div class="stage">
    <div class="card" role="region" aria-labelledby="loginTitle">
        <div class="neon-corner" aria-hidden="true"></div>

        <div class="brand">
            <!-- <div class="logo" aria-hidden="true">
                
                <img src="/public/board.svg" alt="logo">
            </div> -->
            <div>
                <h1 id="loginTitle">CLV Gateway</h1>
                <p>Secure access to your one stop CLV Prediction Solution</p>
            </div>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" formControlName="email" autocomplete="username"
                    placeholder="you@domain.com" required />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div style="position:relative;display:flex;align-items:center;">
                    <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                        autocomplete="current-password" placeholder="••••••••" style="padding-right:56px" />

                    <button
            type="button"
            id="togglePwd"
            aria-label="Show password"
            title="Show password"
            (click)="togglePwd()"
            style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:rgba(210, 230, 255, 0.7);cursor:pointer;font-weight:700;padding:6px;border-radius:8px"
          >
            {{ showPassword ? 'HIDE' : 'SHOW' }}
          </button>
                </div>
            </div>

            <div class="field-row">
                <label class="remember"><input id="remember" formControlName="remember" type="checkbox"
                        style="transform:scale(1.02)" /> Remember
                    me</label>
                <a href="#" style="font-size:13px;color:rgba(200,230,255,0.8);text-decoration:none">Forgot Password?</a>
            </div>

            <button class="btn" id="submitBtn" type="submit" [disabled]="isSubmitting">
                {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
            </button>
            <!-- <div *ngIf="errorMsg" style="margin-top:10px;color:rgba(255,120,120,0.95);font-size:13px;">
                {{ errorMsg }}
            </div> -->

            <div class="soft">Need an account?</div>
            <div class="alt-actions" aria-hidden="true">
                <button class="ghost" type="button" onclick="location.href='/register'">Create an account</button>
            </div>
        </form>
    </div>
</div>
