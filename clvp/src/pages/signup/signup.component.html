<div id="bg-wrap"></div>

<div class="stage">
  <div class="card" role="region" aria-labelledby="loginTitle">
    <div class="neon-corner" aria-hidden="true"></div>

    <div class="brand">
      <div>
        <h1 id="loginTitle">CLV Gateway</h1>
        <p>Secure access to your one stop CLV Prediction Solution</p>
      </div>
    </div>

    <!-- ✅ Angular form wiring (no UI change) -->
    <form
      id="loginForm"
      novalidate
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
    >
      <div class="field">
        <label for="name">Full Name</label>
        <input
          id="name"
          name="fullname"
          type="text"
          placeholder="Your Full Name"
          required
          formControlName="name"
        />
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          placeholder="you@domain.com"
          required
          formControlName="email"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div style="position:relative;display:flex;align-items:center;">
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            style="padding-right:56px"
            formControlName="password"
          />
          <button
            type="button"
            id="togglePwd"
            aria-label="Show password"
            title="Show password"
            (click)="togglePwd()"
            style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:rgba(210, 230, 255, 0.7);cursor:pointer;font-weight:700;padding:6px;border-radius:8px"
          >
            {{ showPassword ? 'HIDE' : 'SHOW' }}
          </button>
        </div>
      </div>

      <button class="btn" id="submitBtn" type="submit" [disabled]="isSubmitting">
        Register
      </button>

      <div class="alt-actions" aria-hidden="true">
        <!-- ✅ Angular navigation (no UI change) -->
        <button class="ghost" type="button" [routerLink]="['/login']">
          Already have an account?
        </button>
      </div>
    </form>
  </div>
</div>
