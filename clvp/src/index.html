<!doctype html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8">
  <title>Customer Lifetime Value Predictor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#3b82f6",
            "background-dark": "#020617",
            "card-dark": "#0f172a",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.375rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "3xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
  <style type="text/tailwindcss">
    :root {
        --glass-bg: rgba(15, 23, 42, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
    }
    .data-mesh-bg {
        background-color: #020617;
        background-image: 
            radial-gradient(circle at 2px 2px, rgba(59, 130, 246, 0.15) 1px, transparent 0);
        background-size: 32px 32px;
    }
    .mesh-gradient {
        background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
    }
    .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
    }
    .input-dark {
        @apply bg-slate-900/50 border-white/10 text-white focus:border-primary focus:ring-1 focus:ring-primary/50 transition-all rounded-xl;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body class="bg-background-dark font-display text-slate-100 antialiased min-h-screen">
  <app-root></app-root>
</body>

</html>
