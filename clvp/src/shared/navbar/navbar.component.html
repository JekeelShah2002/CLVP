<nav class="glass-panel flex items-center justify-between px-6 py-3 w-full backdrop-blur-md">
  <div class="flex items-center gap-3 cursor-pointer" [routerLink]="isLoggedIn() ? '/home' : '/'">
    <div class="flex items-center justify-center size-8 bg-primary rounded-xl text-white shadow-lg shadow-primary/30">
      <span class="material-symbols-outlined text-2xl">analytics</span>
    </div>
    <span class="text-white text-xl font-bold tracking-tight pointer-events-none">CLV Prediction Platform</span>
  </div>

  <ul class="hidden md:flex items-center gap-8 text-sm font-medium">
    <li><a [routerLink]="isLoggedIn() ? '/home' : '/'" class="text-slate-300 hover:text-white hover:text-primary transition-colors cursor-pointer">Home</a></li>
    <li><a routerLink="/customers" class="text-slate-300 hover:text-white hover:text-primary transition-colors cursor-pointer">Customers</a></li>
    <li><a routerLink="/docs" class="text-slate-300 hover:text-white hover:text-primary transition-colors cursor-pointer">Docs</a></li>
  </ul>

  <div class="flex items-center">
    <!-- When NOT logged in -->
    <ng-container *ngIf="!isLoggedIn()">
      <button *ngIf="!isLoginPage()" (click)="goToLogin()"
        class="px-5 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-sm font-semibold text-white transition-colors"
        type="button">
        Login
      </button>

      <button *ngIf="isLoginPage()" (click)="goToSignup()"
        class="px-5 py-2.5 bg-primary hover:bg-primary/90 rounded-xl text-sm font-semibold text-white transition-colors shadow-lg shadow-primary/20"
        type="button">
        Sign Up
      </button>
    </ng-container>

    <!-- When logged in -->
    <div *ngIf="isLoggedIn()" class="relative">
      <button
        class="px-5 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-sm font-semibold text-white transition-colors flex items-center gap-2"
        type="button" (click)="toggleDropdown()">
        Hello, {{ userName() }}
        <span class="material-symbols-outlined text-[18px]">expand_more</span>
      </button>

      <div
        class="absolute right-0 mt-2 w-48 glass-panel rounded-xl shadow-2xl p-2 transition-all duration-200 origin-top-right transform z-50"
        [class.opacity-0]="!isDropdownOpen" [class.invisible]="!isDropdownOpen" [class.scale-95]="!isDropdownOpen"
        [class.opacity-100]="isDropdownOpen" [class.visible]="isDropdownOpen" [class.scale-100]="isDropdownOpen">
        <button
          class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-white/10 hover:text-white transition-colors flex items-center gap-2"
          type="button" (click)="logout()">
          <span class="material-symbols-outlined text-[18px]">logout</span>
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>
